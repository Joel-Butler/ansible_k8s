- name: K8s worker and master nodes pre-config
  hosts: all
  tasks:
    - name: Add hostname to /etc/hosts
      become: true
      become_user: root
      vars:
        comment: '# added by ansible'
      ansible.builtin.lineinfile:
        dest: /etc/hosts
        regexp: "127[.]0[.]0[.]1.*"
        line: "127.0.0.1 localhost.localdomain localhost {{ ansible_facts['hostname'] }} {{ comment }}"
        state: present
        backup: true
    - name: Add Ansible inventory mappings to /etc/hosts
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host }} {{ host }}
          {% endfor %}
    - name: Harden SSHD
      become: true
      become_user: root
      ansible.builtin.template:
        src: sshd-49-defaults.conf
        dest: /etc/ssh/sshd_config.d/49-sshd-defaults.conf
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSHD
    - name: Disable swap
      become: true
      become_user: root
      ansible.builtin.command: sudo swapoff -a
      changed_when: ansible_swaptotal_mb > 0
      when: ansible_swaptotal_mb > 0
    - name: Overlay Module already loaded?
      ansible.builtin.raw: cat /proc/modules | grep -c overlay
      failed_when: false
      register: jb_module_overlay
      changed_when: jb_module_overlay.stdout | default('0', true) | int == 0
    - name: Br_netfilter Module already loaded?
      ansible.builtin.raw: cat /proc/modules | grep -c br_netfilter
      register: jb_module_br_netfilter
      failed_when: false
      changed_when: jb_module_br_netfilter.stdout | default('0', true) | int == 0
    - name: Containerd module settings
      become: true
      become_user: root
      ansible.builtin.template:
        src: containerd.conf
        dest: /etc/modules-load.d/containerd.conf
        mode: "0644"
    - name: Load modules as configured in template
      become: true
      become_user: root
      ansible.builtin.command: modprobe overlay && modprobe br_netfilter
      when:
        - not ansible_check_mode
        - >-
          jb_module_overlay.stdout | default('0', true) | int == 0
          or jb_module_br_netfilter.stdout | default('0', true) | int == 0
      changed_when: true
    - name: Set kubernetes template
      become: true
      become_user: root
      ansible.builtin.template:
        src: kubernetes.conf
        dest: /etc/sysctl.d/kubernetes.conf
        mode: "0644"
      notify:
        - Reload sysctl system
    - name: Deploy dependency libraries and apps via apt.
      become: true
      become_user: root
      ansible.builtin.apt:
        pkg:
          - curl
          - gnupg2
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - nfs-client
          # - linux-modules-extra-raspi
        state: present
    # Note: the Kubernetes template should apply this; retain an explicit setting.
    - name: Enable IP Forwarding
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/sysctl.conf
        block: |
          net.ipv4.ip_forward=1
      notify: Reload sysctl config
      tags:
        - ipForward
  handlers:
    - name: Reload sysctl system
      become: true
      become_user: root
      ansible.builtin.command: sudo sysctl --system
      changed_when: true
    - name: Reload sysctl config
      become: true
      become_user: root
      ansible.builtin.command: sudo sysctl -p /etc/sysctl.conf
      changed_when: true
    - name: Reload SSHD
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
    - name: Reboot system
      become: true
      become_user: root
      ansible.builtin.reboot:
        reboot_timeout: 3600
